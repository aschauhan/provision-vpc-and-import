  PrivateNACL:
    Type: 'AWS::EC2::NetworkAcl'
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref Application
              - !Ref Environment
              - !Ref Vpctype
              - vpc
              - !Ref AWS::Region
              - private
              - nacl
        - Key: Create By
          Value: !Ref CreatedBy
        - Key: Creation Date
          Value: !Ref CreationDate
        - Key: Environment
          Value: !Ref EnvType
        - Key: Application
          Value: !Ref Application
        - Key: cmdb_id
