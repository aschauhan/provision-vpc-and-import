        - !GetAtt 
          - NatGateway3EIP7
          - AllocationId
        - !GetAtt 
          - NatGateway3EIP8
          - AllocationId
      SubnetId: !Ref PublicSubnet3
      Tags:
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref Application
              - !Ref Environment
              - !Ref Vpctype
              - vpc
              - natgw
              - !Select
                - '2'
                - !GetAZs ''
              # - !Ref Az3ZoneId                  
        - Key: Create By
