  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt 
        - NatGateway1EIP1
        - AllocationId
      SecondaryAllocationIds:
        - !GetAtt 
          - NatGateway1EIP2
          - AllocationId
        - !GetAtt 
          - NatGateway1EIP3
          - AllocationId
        - !GetAtt 
          - NatGateway1EIP4
          - AllocationId
        - !GetAtt 
          - NatGateway1EIP5
          - AllocationId
        - !GetAtt 
          - NatGateway1EIP6
          - AllocationId
        - !GetAtt 
          - NatGateway1EIP7
          - AllocationId
        - !GetAtt 
          - NatGateway1EIP8
          - AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref Application
              - !Ref Environment
              - !Ref Vpctype
              - vpc
              - natgw
              - !Select
                - '0'
                - !GetAZs ''
              # - !Ref Az1ZoneId              
        - Key: Create By
          Value: !Ref CreatedBy
        - Key: Creation Date
          Value: !Ref CreationDate
        - Key: cmdb_id
          Value: !Ref cmdbid

  NatGateway2:
