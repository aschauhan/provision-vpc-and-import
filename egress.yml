          - AllocationId
        - !GetAtt 
          - NatGateway2EIP5
          - AllocationId
        - !GetAtt 
          - NatGateway2EIP6
          - AllocationId
        - !GetAtt 
          - NatGateway2EIP7
          - AllocationId
        - !GetAtt 
          - NatGateway2EIP8
          - AllocationId        
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref Application
              - !Ref Environment
              - !Ref Vpctype
              - vpc
              - natgw
              - !Select
