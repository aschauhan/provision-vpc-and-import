          Value: !Ref cmdbid

#### Create Private Subnet Routables ################
  PvtRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref Application
              - !Ref Environment
              - !Ref Vpctype
              - vpc
              - pvt
              - rttb
              - !Select
                - '0'
                - !GetAZs ''
              # - !Ref Az1ZoneId  
  InternetRoute3:
    Type: AWS::EC2::Route
    DependsOn: NatGateway1
    Properties:
      RouteTableId: !Ref PvtRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1

  PvtSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PvtRouteTable1
      SubnetId: !Ref PvtSubnet1

  PvtRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref Application
              - !Ref Environment
              - !Ref Vpctype
              - vpc
              - pvt
              - rttb
              - !Select
                - '1'
                - !GetAZs ''
              # - !Ref Az2ZoneId  
  InternetRoute4:
    Type: AWS::EC2::Route
    DependsOn: NatGateway2
    Properties:
      RouteTableId: !Ref PvtRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway2  
    
  PvtSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PvtRouteTable2
      SubnetId: !Ref PvtSubnet2

  PvtRouteTable3:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref Application
              - !Ref Environment
              - !Ref Vpctype
              - vpc
              - pvt
              - rttb
              - !Select
                - '2'
                - !GetAZs ''
              # - !Ref Az3ZoneId 

  InternetRoute5:
    Type: AWS::EC2::Route
    DependsOn: NatGateway3
    Properties:
      RouteTableId: !Ref PvtRouteTable3
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway3  
    
  PvtSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PvtRouteTable3
      SubnetId: !Ref PvtSubnet3


#### Create DHCP Option Set ################
  Dhcpoptionset:
    Type: AWS::EC2::DHCPOptions
    Properties:
      DomainName: !Ref Domainname
      DomainNameServers:
        - !Ref Domainnameservers
      NetbiosNameServers:
        - !Ref Netbiosnameservers
      NetbiosNodeType: !Ref Netbiosnodetype
      NtpServers:
        - !Ref Ntpservers
      Tags:
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref Application
              - !Ref Environment
              - !Ref Vpctype
              - vpc
              - dhcp
              - !Ref AWS::Region
              - v2
        - Key: Create By
          Value: !Ref CreatedBy
        - Key: Creation Date
          Value: !Ref CreationDate
        - Key: Environment
          Value: !Ref EnvType
        - Key: Application
          Value: !Ref Application
        - Key: cmdb_id
          Value: !Ref cmdbid
  DHCPOptionsAssociation:
    Type: AWS::EC2::VPCDHCPOptionsAssociation
    Properties:
      DhcpOptionsId: !Ref Dhcpoptionset
      VpcId: !Ref VPC

  NoIngressSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: no-ingress-sg
      GroupDescription: Security group with no ingress rule
      VpcId: !Ref VPC

#### Create Public Network Access list ################
  PublicNACL:
    Type: 'AWS::EC2::NetworkAcl'
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref Application
              - !Ref Environment
              - !Ref Vpctype
              - vpc
              - !Ref AWS::Region
              - public
              - nacl
        - Key: Create By
          Value: !Ref CreatedBy
        - Key: Creation Date
          Value: !Ref CreationDate
        - Key: Environment
          Value: !Ref EnvType
        - Key: Application
          Value: !Ref Application
        - Key: cmdb_id
          Value: !Ref cmdbid

  IpubNACLEntry100:
