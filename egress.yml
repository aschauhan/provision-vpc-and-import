#### Create Private Subnets ################
  PvtSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select
        - '0'
        - !GetAZs ''
      # AvailabilityZoneId: !Ref Az1ZoneId      
      CidrBlock: !Select [ 0, !Cidr [ !GetAtt VPC.CidrBlock, 1, 4 ]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref Application
              - !Ref Environment
              - !Ref Vpctype
              - vpc
              - pvt-subnet
              - !Select
                - '0'
                - !GetAZs ''
              # - !Ref Az1ZoneId                  
        - Key: Create By
          Value: !Ref CreatedBy
        - Key: Creation Date
          Value: !Ref CreationDate
        - Key: Environment
          Value: !Ref EnvType
        - Key: Application
          Value: !Ref Application
        - Key: cmdb_id
          Value: !Ref cmdbid

  PvtSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select
        - '1'
        - !GetAZs ''
      # AvailabilityZoneId: !Ref Az2ZoneId
      CidrBlock: !Select [ 1, !Cidr [ !GetAtt VPC.CidrBlock, 2, 4 ]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Join
            - '-'
            - - !Ref Application
              - !Ref Environment
              - !Ref Vpctype
              - vpc
              - pvt-subnet
              - !Select
                - '1'
                - !GetAZs ''
              # - !Ref Az2ZoneId  
        - Key: Create By
          Value: !Ref CreatedBy
        - Key: Creation Date
          Value: !Ref CreationDate
        - Key: Environment
          Value: !Ref EnvType
        - Key: Application
          Value: !Ref Application
        - Key: cmdb_id
          Value: !Ref cmdbid

  PvtSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select
        - '2'
        - !GetAZs ''
      # AvailabilityZoneId: !Ref Az3ZoneId
      CidrBlock: !Select [ 2, !Cidr [ !GetAtt VPC.CidrBlock, 3, 4 ]]
      MapPublicIpOnLaunch: false
      Tags:
